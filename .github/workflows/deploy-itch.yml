name: Checks, build, deploy

# One workflow per commit. Cheap checks run first, the build runs only if they
# pass, and the itch.io upload runs only on main. Every step delegates to a
# script in scripts/ so that CI and a developer's machine run the identical
# build, per CLAUDE.md section 4.1. Do not inline build logic here.
#
# The triggers are deliberately disjoint so a single commit never starts two
# runs: pull_request covers every feature branch, push covers main. A branch
# push with a pull request open used to fire the push trigger here and the
# pull_request trigger in a second workflow file, which produced two runs for
# one commit, and a merge to main produced two more.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      targets:
        description: "Space separated targets, empty for ENABLED_TARGETS in build.config"
        required: false
        default: ""
      dry_run:
        description: "Build and validate, but do not upload to itch.io"
        type: boolean
        required: false
        default: false

# One run per ref. A superseded pull request run is cancelled because its
# result no longer matters, but a main run is allowed to finish: cancelling a
# half finished upload would leave a partial build on itch.io.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    name: Style and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Enforces CLAUDE.md section 1. Until now the rule was a documented
      # grep that nothing ran.
      - name: Writing style (no em or en dashes)
        run: ./scripts/check-style.sh

      - name: Shell syntax
        run: |
          set -euo pipefail
          fail=0
          for f in scripts/*.sh scripts/lib/*.sh; do
            if bash -n "$f"; then
              echo "ok    $f"
            else
              echo "FAIL  $f"
              fail=1
            fi
          done
          exit "$fail"

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning scripts/*.sh scripts/lib/*.sh

      # Catches a target named in ENABLED_TARGETS that has no row in the
      # TARGETS table, and a target whose preset is missing from
      # export_presets.cfg. Both are silent misconfigurations otherwise.
      - name: Validate build config against export presets
        run: ./scripts/check-config.sh

  deploy:
    name: Build and deploy
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Whether this run is allowed to publish. Defined once and referenced by
    # every step that depends on it, because the same condition was written
    # out twice already and a third copy is how they start to disagree.
    env:
      CAN_DEPLOY: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so scripts/lib/common.sh can derive a version from
          # git describe rather than falling back to "unknown".
          fetch-depth: 0

      - name: Read build config
        id: config
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source build.config
          echo "godot_version=$GODOT_VERSION" >> "$GITHUB_OUTPUT"
          echo "godot_release=$GODOT_RELEASE" >> "$GITHUB_OUTPUT"
          echo "godot_flavor=$GODOT_FLAVOR"   >> "$GITHUB_OUTPUT"
          echo "dotnet_version=$DOTNET_VERSION" >> "$GITHUB_OUTPUT"
          echo "targets=$ENABLED_TARGETS"     >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        if: steps.config.outputs.godot_flavor == 'mono'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.config.outputs.dotnet_version }}

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            .tools/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ steps.config.outputs.godot_version }}-${{ steps.config.outputs.godot_release }}-${{ steps.config.outputs.godot_flavor }}

      - name: Install Godot
        run: ./scripts/install-godot.sh

      # Only on runs that can publish. butler is fetched from a third party
      # CDN, so installing it on every pull request tied this job's health to
      # itch.io's uptime for a tool those runs never invoke. An itch.io outage
      # (504 then 500s from broth.itch.zone) failed a pull request that was
      # never going to deploy. scripts/deploy-itch.sh already fails with a
      # clear message if butler is somehow missing when it is genuinely needed.
      - name: Install butler
        if: env.CAN_DEPLOY == 'true'
        run: ./scripts/install-butler.sh

      # The layout test (CLAUDE.md 6.4) instantiates real Control nodes, and a
      # Control will not lay out or report a size without a rendering context,
      # so it runs under xvfb. Installed explicitly rather than assumed present
      # on the runner image: run-tests.sh SKIPS that test when xvfb-run is
      # missing, and a test that quietly skips is worse than one that fails,
      # because the job still goes green and nobody looks again.
      - name: Install xvfb
        run: sudo apt-get install -y -qq xvfb

      # The sim library must pass its headless suite, and the layout must still
      # be fixed, before anything exports.
      - name: Run simulation and layout tests
        run: ./scripts/run-tests.sh

      - name: Build
        run: ./scripts/build.sh ${{ github.event.inputs.targets }}

      # An export that succeeds is not the same as a build that works. This
      # boots the exported Linux binary headless and requires it to print its
      # smoke marker, which catches a missing .pck or a runtime script error.
      - name: Verify the build boots
        run: ./scripts/verify-build.sh

      # Kept regardless of whether the upload succeeds, so a failed deploy
      # still leaves something to inspect.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: builds
          path: builds/
          retention-days: 14
          if-no-files-found: error

      - name: Check for itch.io credentials
        id: creds
        if: env.CAN_DEPLOY == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::BUTLER_API_KEY is not set, skipping the itch.io upload. Artifacts were still built and uploaded to this run."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Gated on main so a pull request can never publish to itch.io.
      - name: Deploy to itch.io
        if: env.CAN_DEPLOY == 'true' && steps.creds.outputs.present == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: ./scripts/deploy-itch.sh ${{ github.event.inputs.targets }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### itch.io deploy"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | \`$(git describe --tags --dirty 2>/dev/null || echo "r$(git rev-list --count HEAD)-$(git rev-parse --short HEAD)")\` |"
            echo "| Targets | \`${{ github.event.inputs.targets || steps.config.outputs.targets }}\` |"
            echo "| Credentials | ${{ steps.creds.outputs.present == 'true' && 'present' || 'not checked or missing' }} |"
            echo "| Deployed | ${{ env.CAN_DEPLOY == 'true' && 'yes, if credentials present' || 'no, not main' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
