; Godot export presets.
;
; Preset names here must match the "godot preset" column in build.config
; exactly. scripts/build.sh passes the name straight to Godot's
; --export-release flag, so a rename in one place without the other breaks
; the build with a clear "preset not found" style failure.
;
; VERIFY BEFORE FIRST RUN: this file was hand written without a Godot editor
; available (the authoring session could not download Godot, see
; docs/08-build-and-deploy.md section 7). Godot normally generates it. Open the
; project in the editor once, check Project > Export, and let the editor
; re-save this file so any option keys that changed in the pinned Godot
; version are corrected. The preset names and export_path values are the parts
; that must survive that round trip.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="builds/linux/the-federation.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false

