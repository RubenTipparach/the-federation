; Godot export presets.
;
; Preset names here must match the "godot preset" column in build.config
; exactly. scripts/build.sh passes the name straight to Godot's
; --export-release flag, so a rename in one place without the other breaks
; the build with a clear "preset not found" style failure.
;
; Hand written, where Godot normally generates this file. Godot 4.7.1 accepted
; it and produced working Linux, Windows, and Web exports, so it is known good
; rather than assumed. Still worth opening the project in the editor once and
; letting it re-save, so any option keys Godot silently ignored get corrected.
; The preset names and export_path values must survive that round trip, because
; build.config refers to them.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="builds/linux/the-federation.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false

